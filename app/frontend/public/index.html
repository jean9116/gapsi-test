<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plataforma de proveedores</title>
</head>
<body>
  <h1>Plataforma de proveedores</h1>
  <p>Estado de la API: <span id="estado">comprobando…</span></p>
  <script>
    fetch("/api/healthz").then(r => r.json()).then(d => estado.textContent = d.status)
      .catch(() => estado.textContent = "sin respuesta");
  </script>
</body>
</html>
